name: Reportar un bug
description: Algo de un componente no anda como dice la documentación.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: component
    attributes:
      label: Componente
      description: El nombre como figura en la documentación, por ejemplo `date-picker`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de sebs7n-ui
      placeholder: "1.13.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Qué pasó
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
  - type: textarea
    id: reproduction
    attributes:
      label: Cómo reproducirlo
      description: Los pasos, o un link a un repo o a un sandbox mínimo.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador y sistema
      placeholder: "Safari 19 en iOS"
