version: 2

# Dos manifiestos, dos lockfiles: el paquete y el sitio de documentación se instalan por
# separado (el sitio consume el paquete por tarball, no por workspace), así que Dependabot
# los tiene que mirar de a uno.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Minors y patches en un solo PR: son los que casi siempre se mergean sin leer el diff,
      # y abrirlos de a uno es diez PRs por semana que nadie mira. Los majors quedan sueltos
      # justamente porque hay que leerlos.
      menores:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/docs/site"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      menores:
        update-types: ["minor", "patch"]
